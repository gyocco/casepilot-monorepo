name: casepilot-local

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${CASEPILOT_POSTGRES_DB:-casepilot}
      POSTGRES_USER: ${CASEPILOT_POSTGRES_USER:-casepilot}
      POSTGRES_PASSWORD: ${CASEPILOT_POSTGRES_PASSWORD:?Run pnpm infra:env to create infra/docker/.env}
    ports:
      - "127.0.0.1:${CASEPILOT_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  firebase-auth-emulator:
    build:
      context: ./firebase
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${CASEPILOT_FIREBASE_AUTH_EMULATOR_PORT:-9099}:9099"
      - "127.0.0.1:${CASEPILOT_FIREBASE_EMULATOR_UI_PORT:-4000}:4000"
    volumes:
      - firebase-auth-data:/emulator/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:9099/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s

volumes:
  postgres-data:
  firebase-auth-data:
