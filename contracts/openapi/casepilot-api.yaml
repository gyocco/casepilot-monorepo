openapi: 3.0.3
info:
  title: CasePilot API
  version: 0.4.0
  description: CRUD público de los 28 modelos de servicios profesionales y sondas técnicas. Autenticación diferida; businessAccountId es selección de datos, no identidad verificada.
servers:
  - url: http://127.0.0.1:3000
    description: Desarrollo local
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: Verifica que el proceso HTTP responde
      description: No invoca Application ni abre una conexión a PostgreSQL.
      security: []
      responses:
        '200':
          description: API disponible
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHealthResponse'
        default:
          $ref: '#/components/responses/ApiError'
  /health/database:
    get:
      operationId: getDatabaseHealth
      summary: Verifica la lectura de HealthCheckObject mediante Application y TypeORM
      description: Un SELECT sobre la tabla técnica; no escribe datos. Una tabla vacía también está disponible.
      security: []
      responses:
        '200':
          description: Tabla consultable
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealthResponse'
        '500':
          description: No es posible consultar la tabla técnica
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - type: object
                    properties:
                      status:
                        type: integer
                        enum: [500]
                      code:
                        type: string
                        enum: [UNEXPECTED_ERROR]
        default:
          $ref: '#/components/responses/ApiError'
